<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>CS2 Playbook</title>
<style>
:root {
  --bg: #16181b; --panel: #1c1f23; --border: #2a2d31; --text: #d7dadf; --muted: #8a9099;
  --accent: #6a9f5b; --accent-bg: color-mix(in srgb, var(--accent) 16%, var(--bg)); --warn: #d29a3a; --err: #d0544f;
  --smoke: #7cc7ff; --flash: #e3c34a; --molotov: #e0604e;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, select, textarea, input { font: inherit; color: inherit; }
code { font-family: ui-monospace, Menlo, Consolas, monospace; background: var(--panel); padding: 1px 4px; border-radius: 2px; }
header { display: flex; align-items: center; gap: 16px; padding: 8px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
.brand { font-weight: 700; letter-spacing: .08em; font-size: 12px; color: var(--muted); }
.spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 3px; overflow: hidden; }
.seg button { background: none; border: 0; border-right: 1px solid var(--border); padding: 4px 10px; cursor: pointer; color: var(--muted); }
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--accent-bg); color: var(--accent); }
.me { display: flex; align-items: center; gap: 6px; color: var(--muted); }
select { background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 3px 6px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; text-decoration: underline; }
.linkbtn:hover { color: var(--text); }
nav.tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--border); }
nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; color: var(--muted); cursor: pointer; }
nav.tabs button:hover { color: var(--text); }
nav.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); }
nav.tabs .sep { width: 1px; background: var(--border); margin: 8px; }
main { padding: 12px 16px 48px; max-width: 1600px; }
h1 { font-size: 16px; margin: 0; }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
.titlebar { display: flex; align-items: center; gap: 10px; margin: 8px 0 12px; }
.badge { font-size: 10px; font-weight: 700; letter-spacing: .06em; border: 1px solid var(--warn); color: var(--warn); padding: 1px 5px; border-radius: 2px; }
.split { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; align-items: start; }
.shot { display: block; max-width: 100%; max-height: 70vh; object-fit: contain; background: #0f1012; border: 1px solid var(--border); cursor: zoom-in; }
.missing { display: flex; align-items: center; justify-content: center; min-height: 120px; padding: 12px; border: 1px solid var(--err); color: var(--err); background: #1a1315; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; }
.pre { white-space: pre-wrap; margin: 0; }
ol.steps { margin: 0; padding-left: 20px; }
ol.steps li { margin: 2px 0; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; vertical-align: top; padding: 5px 8px; border-bottom: 1px solid var(--border); }
th { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.muted { color: var(--muted); }
.warn { color: var(--warn); }
.err { color: var(--err); }
.empty { padding: 24px; border: 1px dashed var(--border); color: var(--muted); text-align: center; }
.notes { margin-top: 8px; }
.notes textarea { width: 100%; min-height: 70px; resize: vertical; background: var(--bg); border: 1px solid var(--border); border-radius: 3px; padding: 6px; }
.notes textarea:focus { outline: 1px solid var(--accent); }
.notes textarea:disabled { opacity: .5; }
.notes .bar { display: flex; align-items: center; gap: 10px; margin-top: 4px; font-size: 12px; }
.layout-lineups { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 16px; }
.plist button { display: flex; justify-content: space-between; width: 100%; background: none; border: 0; border-left: 2px solid transparent; padding: 4px 8px; color: var(--muted); cursor: pointer; text-align: left; }
.plist button:hover { color: var(--text); }
.plist button[aria-pressed="true"] { color: var(--text); border-left-color: var(--accent); background: var(--accent-bg); }
.filters { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 4px; }
.filters > span { display: flex; align-items: center; gap: 6px; }
.lineup { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 16px; padding: 12px 0 12px 12px; border-bottom: 1px solid var(--border); border-left: 3px solid var(--border); }
.lineup.type-smoke { border-left-color: var(--smoke); }
.lineup.type-flash { border-left-color: var(--flash); }
.lineup.type-molotov { border-left-color: var(--molotov); }
.ut-smoke { color: var(--smoke); }
.ut-flash { color: var(--flash); }
.ut-molotov { color: var(--molotov); }
.ut { font-weight: 600; padding: 0 3px; border-radius: 2px; background: color-mix(in srgb, currentColor 16%, transparent); }
.type { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border: 1px solid currentColor; padding: 1px 6px; border-radius: 2px; }
.asp { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px; color: var(--muted); border: 1px solid var(--border); padding: 0 4px; border-radius: 2px; margin-left: 6px; white-space: nowrap; }
.lineup .shot { max-height: 220px; }
.res { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--accent); border: 1px solid var(--accent); padding: 0 5px; border-radius: 2px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.board-svg { display: block; width: 100%; max-height: 80vh; background: #0b1016; border: 1px solid var(--border); border-radius: 4px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; cursor: crosshair; }
.board-svg .grenade { transition: opacity .15s; }
.board-svg .ut-smoke { color: #dde3ea; } /* on the radar smoke stays a light cloud, apart from the blue player */
.pname { font-weight: 600; white-space: nowrap; }
.board-svg.focused .grenade:not(.on) { opacity: .12; }
.board-svg.focused .routes { opacity: .45; }
.coords { margin: 4px 0 0; font-size: 12px; }
.hint { margin: 0 0 4px; font-size: 12px; }
ol.steps li.step-btn { cursor: pointer; padding: 2px 6px; margin-left: -6px; border-radius: 3px; }
ol.steps li.step-btn:hover { background: var(--panel); }
ol.steps li.step-btn.on { background: var(--accent-bg); color: var(--text); outline: 1px solid var(--accent); }
.insta-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; align-content: start; }
.insta-card { position: relative; }
.insta-card .shot { width: 100%; max-height: none; aspect-ratio: 16 / 9; object-fit: cover; }
.insta-card .num { position: absolute; top: 6px; left: 6px; min-width: 30px; height: 30px; padding: 0 8px; border-radius: 15px; display: flex; align-items: center; justify-content: center; background: var(--accent); color: #0b1016; font-size: 17px; font-weight: 700; pointer-events: none; }
.insta-card .cap { position: absolute; right: 6px; bottom: 6px; padding: 1px 6px; border-radius: 3px; background: rgba(0, 0, 0, .65); font-size: 12px; pointer-events: none; }
.fatal { max-width: 720px; margin: 48px auto; padding: 16px; border: 1px solid var(--err); }
.fatal h1 { color: var(--err); margin-bottom: 8px; }
#problems { position: fixed; left: 0; right: 0; bottom: 0; background: #231c12; border-top: 1px solid var(--warn); color: var(--warn); font-size: 12px; max-height: 40vh; overflow: auto; }
#problems summary { padding: 6px 16px; cursor: pointer; }
#problems ul { margin: 0; padding: 0 16px 8px 32px; }
#lightbox { position: fixed; inset: 0; z-index: 10; background: rgba(0, 0, 0, .92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
#lightbox img { max-width: 100%; max-height: calc(100vh - 64px); object-fit: contain; }
#lightbox .cap { margin-top: 8px; color: var(--muted); font-size: 12px; }
#lightbox button { position: absolute; top: 10px; right: 14px; background: none; border: 1px solid var(--border); color: var(--text); padding: 2px 8px; cursor: pointer; }
@media (max-width: 1000px) {
  header { flex-wrap: wrap; }
  .split, .lineup, .layout-lineups { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header id="top" hidden>
  <span class="brand">CS2 PLAYBOOK</span>
  <div class="seg" id="maps" role="group" aria-label="Mapa"></div>
  <span class="spacer"></span>
  <label class="me">Kim jestem: <select id="me"></select></label>
  <button type="button" class="linkbtn" id="export-notes">Eksport notatek</button>
  <button type="button" class="linkbtn" id="import-notes">Import notatek</button>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <span id="io-status" class="muted" role="status"></span>
</header>
<nav class="tabs" id="tabs" role="tablist" hidden></nav>
<main id="main"><p class="muted">Wczytywanie…</p></main>
<details id="problems" hidden><summary></summary><ul></ul></details>
<div id="lightbox" hidden><button type="button" aria-label="Zamknij">✕</button><img alt=""><div class="cap"></div></div>
<script id="core">
// Pure logic, no DOM. Loaded by tools/test_core.mjs for unit tests.
const Core = (() => {
  "use strict";
  const NOTE_PREFIX = "cs2pb:v1:notes:";
  const ME_KEY = "cs2pb:v1:me";
  const TABS = ["pistolowka", "execute-a", "execute-b", "backup", "insta", "lineupy", "notatki"];
  const VARIANTS = ["A", "B"];
  const SPAWN_SIDES = ["T", "CT"];
  const LABEL_KINDS = ["site", "spawn", "callout"];
  const RADAR_SIZE = 1024; // board coordinates are radar image pixels, 0..1024
  const STRATEGY_SLOTS = ["pistol", "execute", "backup"];
  const MAP_ID_RE = /^[a-z0-9-]+$/;
  const HEX_RE = /^#[0-9a-fA-F]{6}$/;
  const LINEUP_REQUIRED = ["id", "player", "name", "target", "side", "type", "aspect", "image"];
  const ASPECTS = ["4:3", "4:3 stretched", "16:9", "21:9"];
  const TYPES = ["smoke", "flash", "molotov"];
  const SIDES = ["T", "CT"];
  const SITES = ["A", "B", "Mid"];
  const RELATIVE_HINT = "musi być względna (bez / na początku, bez .., bez http)";

  const isObj = (x) => x !== null && typeof x === "object" && !Array.isArray(x);
  const arr = (x) => (Array.isArray(x) ? x : []);
  const isText = (x) => typeof x === "string" && x.trim() !== "";
  const isRelativePath = (x) =>
    isText(x) && !x.startsWith("/") && !/^[A-Za-z][A-Za-z0-9+.-]*:/.test(x) && !x.split("/").includes("..");
  const isPoint = (x) =>
    Array.isArray(x) && x.length === 2 && x.every((n) => typeof n === "number" && Number.isFinite(n) && n >= 0 && n <= RADAR_SIZE);

  // ── JSON with reliable error positions (V8 omits them for some errors) ──
  function findJsonErrorOffset(text) {
    let i = 0;
    const fail = () => { throw i; };
    const ws = () => { while (i < text.length && " \t\n\r".includes(text[i])) i++; };
    function value() {
      ws();
      const c = text[i];
      if (c === "{") return object();
      if (c === "[") return array();
      if (c === '"') return string();
      if (c === "-" || (c >= "0" && c <= "9")) return number();
      for (const lit of ["true", "false", "null"]) {
        if (text.startsWith(lit, i)) { i += lit.length; return; }
      }
      fail();
    }
    function object() {
      i++; ws();
      if (text[i] === "}") { i++; return; }
      for (;;) {
        ws();
        if (text[i] !== '"') fail();
        string(); ws();
        if (text[i] !== ":") fail();
        i++;
        value(); ws();
        if (text[i] === ",") { i++; continue; }
        if (text[i] === "}") { i++; return; }
        fail();
      }
    }
    function array() {
      i++; ws();
      if (text[i] === "]") { i++; return; }
      for (;;) {
        value(); ws();
        if (text[i] === ",") { i++; continue; }
        if (text[i] === "]") { i++; return; }
        fail();
      }
    }
    function string() {
      i++;
      while (i < text.length) {
        const c = text[i];
        if (c === '"') { i++; return; }
        if (c === "\\") {
          const e = text[i + 1];
          if (e === "u") {
            if (!/^[0-9a-fA-F]{4}$/.test(text.slice(i + 2, i + 6))) fail();
            i += 6;
            continue;
          }
          if (e === undefined || !'"\\/bfnrt'.includes(e)) fail();
          i += 2;
          continue;
        }
        if (c < " ") fail();
        i++;
      }
      fail();
    }
    function number() {
      const m = /^-?(0|[1-9]\d*)(\.\d+)?([eE][+-]?\d+)?/.exec(text.slice(i));
      if (!m) fail();
      i += m[0].length;
    }
    try {
      value(); ws();
      if (i < text.length) fail();
      return null;
    } catch (pos) {
      if (typeof pos === "number") return pos;
      throw pos;
    }
  }

  function parseJson(text, path) {
    const clean = String(text).replace(/^﻿/, "");
    try {
      return JSON.parse(clean);
    } catch {
      const offset = findJsonErrorOffset(clean);
      let where = "";
      if (offset !== null) {
        const lines = clean.slice(0, offset).split("\n");
        where = ` — linia ${lines.length}, kolumna ${lines[lines.length - 1].length + 1}`;
      }
      throw new Error(`${path}: błąd składni JSON${where}`);
    }
  }

  function plural(n, one, few, many) {
    if (n === 1) return one;
    const d = n % 10, dd = n % 100;
    return d >= 2 && d <= 4 && !(dd >= 12 && dd <= 14) ? few : many;
  }

  // ── normalisation: shapes the UI can rely on ──
  function normalizeTeam(team) {
    const t = isObj(team) ? team : {};
    return {
      roles: arr(t.roles).filter((r) => isObj(r) && isText(r.id)),
      players: arr(t.players).filter((p) => isObj(p) && isText(p.id)),
    };
  }

  // keeps only the parts of a board the UI can draw; checkMap reports the rest
  function normalizeBoard(b) {
    if (!isObj(b)) return null;
    const players = {};
    for (const [role, route] of Object.entries(isObj(b.players) ? b.players : {})) {
      if (Array.isArray(route) && route.length >= 2 && route.every(isPoint)) players[role] = route;
    }
    const grenades = arr(b.grenades).filter((g) => isObj(g) && TYPES.includes(g.type) && isPoint(g.from) && isPoint(g.to));
    return { players, grenades };
  }

  function normalizeStrategy(s) {
    if (!isObj(s)) return null;
    return {
      ...s,
      steps: arr(s.steps).filter((x) => typeof x === "string"),
      assignments: arr(s.assignments).filter(isObj),
      board: normalizeBoard(s.board),
    };
  }

  function normalizeMap(data) {
    const d = isObj(data) ? data : {};
    const s = isObj(d.strategies) ? d.strategies : {};
    const ex = isObj(s.execute) ? s.execute : {};
    const radar = isObj(d.radar) && isRelativePath(d.radar.image)
      ? { image: d.radar.image, labels: arr(d.radar.labels).filter((l) => isObj(l) && isText(l.text) && isPoint(l.at)) }
      : null;
    const spawns = {};
    for (const side of SPAWN_SIDES) if (isObj(d.spawns) && isRelativePath(d.spawns[side])) spawns[side] = d.spawns[side];
    return {
      name: d.name,
      radar,
      spawns,
      strategies: {
        pistol: normalizeStrategy(s.pistol),
        backup: normalizeStrategy(s.backup),
        execute: { A: normalizeStrategy(ex.A), B: normalizeStrategy(ex.B) },
      },
      lineups: arr(d.lineups).filter((l) => isObj(l) && isText(l.id)),
    };
  }

  // ── data checks (mirrors tools/validate.py, minus file existence) ──
  function checkMapsIndex(data) {
    const file = "data/maps.json";
    const out = [];
    const p = (message) => out.push({ file, message });
    if (!isObj(data) || !Array.isArray(data.maps)) { p('oczekiwano obiektu z listą "maps"'); return out; }
    const seen = new Set();
    data.maps.forEach((m, i) => {
      if (!isObj(m) || !isText(m.id)) return p(`maps[${i}] musi mieć "id" (tekst)`);
      if (!MAP_ID_RE.test(m.id)) p(`id mapy "${m.id}" może zawierać tylko a-z, 0-9 i -`);
      if (seen.has(m.id)) p(`zduplikowane id mapy "${m.id}"`);
      seen.add(m.id);
      if (!isText(m.name)) p(`mapa "${m.id}" nie ma "name"`);
      if (m.accent != null && !mapAccent(m)) p(`mapa "${m.id}": "accent" musi być kolorem w formacie #RRGGBB`);
    });
    return out;
  }

  function checkTeam(team) {
    const file = "data/team.json";
    const out = [];
    const p = (message) => out.push({ file, message });
    if (!isObj(team)) { p('oczekiwano obiektu z listami "roles" i "players"'); return out; }
    if (!Array.isArray(team.roles)) p('brak listy "roles"');
    if (!Array.isArray(team.players)) p('brak listy "players"');
    const roleIds = new Set();
    arr(team.roles).forEach((r, i) => {
      if (!isObj(r) || !isText(r.id)) return p(`roles[${i}] musi mieć "id" (tekst)`);
      if (roleIds.has(r.id)) p(`zduplikowane id roli "${r.id}"`);
      roleIds.add(r.id);
      if (!isText(r.name)) p(`rola "${r.id}" nie ma "name"`);
    });
    const playerIds = new Set();
    const holders = new Map(); // roleId -> { active: [], sub: [] }
    arr(team.players).forEach((pl, i) => {
      if (!isObj(pl) || !isText(pl.id)) return p(`players[${i}] musi mieć "id" (tekst)`);
      if (playerIds.has(pl.id)) p(`zduplikowane id gracza "${pl.id}"`);
      playerIds.add(pl.id);
      if (!isText(pl.name)) p(`gracz "${pl.id}" nie ma "name"`);
      const statusOk = pl.status === "active" || pl.status === "sub";
      if (!statusOk) p(`gracz "${pl.id}": "status" musi być "active" albo "sub"`);
      if (pl.aspect != null && !ASPECTS.includes(pl.aspect)) {
        p(`gracz "${pl.id}": "aspect" musi być jednym z: ${ASPECTS.join(", ")} albo null`);
      }
      if (pl.color != null && !(typeof pl.color === "string" && HEX_RE.test(pl.color))) {
        p(`gracz "${pl.id}": "color" musi być kolorem w formacie #RRGGBB`);
      }
      if (pl.short != null && !(isText(pl.short) && pl.short.trim().length <= 3)) {
        p(`gracz "${pl.id}": "short" musi być skrótem 1–3 znaków`);
      }
      if (pl.role == null) return;
      if (typeof pl.role !== "string" || !roleIds.has(pl.role)) return p(`gracz "${pl.id}": nieznana rola "${pl.role}"`);
      if (!statusOk) return;
      if (!holders.has(pl.role)) holders.set(pl.role, { active: [], sub: [] });
      holders.get(pl.role)[pl.status].push(pl.id);
    });
    for (const [role, h] of holders) {
      if (h.active.length > 1) p(`rola "${role}" ma kilku aktywnych graczy: ${h.active.join(", ")}`);
      if (h.sub.length > 1) p(`rola "${role}" ma kilku rezerwowych: ${h.sub.join(", ")}`);
    }
    return out;
  }

  function checkStrategy(st, label, roleIds, p) {
    if (st == null) return;
    if (!isObj(st)) return p(`strategia "${label}" musi być obiektem albo null`);
    if (!isText(st.title)) p(`strategia "${label}" nie ma "title"`);
    if (st.image != null && !isRelativePath(st.image)) p(`strategia "${label}": ścieżka "image" ${RELATIVE_HINT}`);
    if (st.steps != null && !(Array.isArray(st.steps) && st.steps.every((s) => typeof s === "string"))) {
      p(`strategia "${label}": "steps" musi być listą tekstów`);
    }
    if (st.board != null) checkBoard(st.board, label, roleIds, Array.isArray(st.steps) ? st.steps.length : 0, p);
    if (st.assignments == null) return;
    if (!Array.isArray(st.assignments)) return p(`strategia "${label}": "assignments" musi być listą`);
    st.assignments.forEach((a, i) => {
      const role = isObj(a) ? a.role : undefined;
      if (roleIds && (typeof role !== "string" || !roleIds.has(role))) {
        p(`strategia "${label}": nieznana rola "${role ?? ""}" w assignments[${i}]`);
      }
    });
  }

  function checkBoard(b, label, roleIds, stepCount, p) {
    const at = `strategia "${label}": board`;
    if (!isObj(b)) return p(`${at} musi być obiektem`);
    if (b.players != null && !isObj(b.players)) p(`${at}.players musi być obiektem {rola: [[x, y], ...]}`);
    for (const [role, route] of Object.entries(isObj(b.players) ? b.players : {})) {
      if (roleIds && !roleIds.has(role)) p(`${at}.players: nieznana rola "${role}"`);
      if (!(Array.isArray(route) && route.length >= 2 && route.every(isPoint))) {
        p(`${at}.players.${role} musi być listą co najmniej 2 punktów [x, y] (0–${RADAR_SIZE})`);
      }
    }
    if (b.grenades != null && !Array.isArray(b.grenades)) p(`${at}.grenades musi być listą`);
    arr(b.grenades).forEach((g, i) => {
      const gat = `${at}.grenades[${i}]`;
      if (!isObj(g)) return p(`${gat} musi być obiektem`);
      if (roleIds && !(typeof g.role === "string" && roleIds.has(g.role))) p(`${gat}: nieznana rola "${g.role ?? ""}"`);
      if (!TYPES.includes(g.type)) p(`${gat}: "type" musi być jednym z: ${TYPES.join(", ")}`);
      if (!isPoint(g.from) || !isPoint(g.to)) p(`${gat}: "from" i "to" muszą być punktami [x, y] (0–${RADAR_SIZE})`);
      if (g.step != null && !(Number.isInteger(g.step) && g.step >= 1 && g.step <= stepCount)) {
        p(`${gat}: "step" musi być numerem kroku 1–${stepCount}`);
      }
    });
  }

  function checkRadar(r, p) {
    if (!isObj(r)) return p('"radar" musi być obiektem z "image" i "labels"');
    if (!isRelativePath(r.image)) p(`ścieżka "radar.image" ${RELATIVE_HINT}`);
    if (r.labels != null && !Array.isArray(r.labels)) return p('"radar.labels" musi być listą');
    arr(r.labels).forEach((l, i) => {
      if (!isObj(l) || !isText(l.text) || !isPoint(l.at)) return p(`radar.labels[${i}] musi mieć "text" i punkt "at" [x, y]`);
      if (l.kind != null && !LABEL_KINDS.includes(l.kind)) p(`radar.labels[${i}]: "kind" musi być jednym z: ${LABEL_KINDS.join(", ")}`);
    });
  }

  function checkSpawns(sp, p) {
    if (!isObj(sp)) return p('"spawns" musi być obiektem {"T": ścieżka, "CT": ścieżka}');
    for (const [side, path] of Object.entries(sp)) {
      if (!SPAWN_SIDES.includes(side)) p(`nieznany klucz "${side}" w "spawns" (dozwolone: ${SPAWN_SIDES.join(", ")})`);
      else if (!isRelativePath(path)) p(`ścieżka "spawns.${side}" ${RELATIVE_HINT}`);
    }
  }

  function checkMap(data, mapId, team) {
    const file = `data/${mapId}.json`;
    const out = [];
    const p = (message) => out.push({ file, message });
    if (!isObj(data)) { p("oczekiwano obiektu"); return out; }
    if (data.id !== mapId) p(`"id" w pliku ("${data.id}") nie zgadza się z data/maps.json ("${mapId}")`);
    // null when team data is unusable: reference checks are skipped (same as tools/validate.py team_ids)
    const t = normalizeTeam(team);
    const roleIds = isObj(team) && Array.isArray(team.roles) ? new Set(t.roles.map((r) => r.id)) : null;
    const playerIds = isObj(team) && Array.isArray(team.players) ? new Set(t.players.map((x) => x.id)) : null;
    if (!("strategies" in data)) p('brak "strategies"');
    else if (!isObj(data.strategies)) p('"strategies" musi być obiektem');
    else {
      const s = data.strategies;
      for (const k of Object.keys(s)) {
        if (!STRATEGY_SLOTS.includes(k)) p(`nieznany klucz "${k}" w "strategies" (dozwolone: ${STRATEGY_SLOTS.join(", ")})`);
      }
      checkStrategy(s.pistol, "pistol", roleIds, p);
      checkStrategy(s.backup, "backup", roleIds, p);
      if (s.execute != null && !isObj(s.execute)) p('"strategies.execute" musi być obiektem z kluczami "A" i "B"');
      else if (isObj(s.execute)) {
        for (const k of Object.keys(s.execute)) {
          if (!VARIANTS.includes(k)) p(`nieznany klucz "${k}" w "strategies.execute" (dozwolone: ${VARIANTS.join(", ")})`);
        }
        VARIANTS.forEach((v) => checkStrategy(s.execute[v], `execute.${v}`, roleIds, p));
      }
    }
    if (data.radar != null) checkRadar(data.radar, p);
    if (data.spawns != null) checkSpawns(data.spawns, p);
    if (data.lineups != null && !Array.isArray(data.lineups)) p('"lineups" musi być listą');
    const seen = new Set();
    arr(data.lineups).forEach((l, i) => {
      if (!isObj(l)) return p(`lineups[${i}] musi być obiektem`);
      const name = isText(l.id) ? l.id : `#${i}`;
      for (const k of LINEUP_REQUIRED) if (!isText(l[k])) p(`lineup "${name}": brak pola "${k}"`);
      if (isText(l.id)) {
        if (seen.has(l.id)) p(`zduplikowane id lineupu "${l.id}"`);
        seen.add(l.id);
      }
      if (isText(l.side) && l.side !== "T" && l.side !== "CT") p(`lineup "${name}": "side" musi być "T" albo "CT"`);
      if (isText(l.player) && playerIds && !playerIds.has(l.player)) p(`lineup "${name}": nieznany gracz "${l.player}"`);
      if (isText(l.image) && !isRelativePath(l.image)) p(`lineup "${name}": ścieżka "image" ${RELATIVE_HINT}`);
      if (isText(l.type) && !TYPES.includes(l.type)) p(`lineup "${name}": "type" musi być jednym z: ${TYPES.join(", ")}`);
      if (l.site != null && !SITES.includes(l.site)) p(`lineup "${name}": "site" musi być jednym z: ${SITES.join(", ")}`);
      if (l.spawn != null && !(Number.isInteger(l.spawn) && l.spawn >= 1 && l.spawn <= 10)) {
        p(`lineup "${name}": "spawn" musi być liczbą całkowitą 1–10`);
      }
      if (isText(l.aspect) && !ASPECTS.includes(l.aspect)) p(`lineup "${name}": "aspect" musi być jednym z: ${ASPECTS.join(", ")}`);
      if ("resolution" in l) p(`lineup "${name}": pole "resolution" nie jest już używane — użyj "aspect"`);
    });
    return out;
  }

  // ── roster ──
  function resolveRole(team, roleId) {
    const holders = team.players.filter((p) => p.role === roleId);
    const active = holders.filter((p) => p.status === "active");
    if (active.length) return { kind: "active", players: active };
    const subs = holders.filter((p) => p.status === "sub");
    if (subs.length) return { kind: "sub", players: subs };
    return { kind: "none", players: [] };
  }

  function groupPlayers(team) {
    return {
      active: team.players.filter((p) => p.status !== "sub"),
      subs: team.players.filter((p) => p.status === "sub"),
    };
  }

  function validMe(id, team) {
    return team.players.some((p) => p.id === id) ? id : null;
  }

  function defaultLineupPlayer(team, meId) {
    if (validMe(meId, team)) return meId;
    const { active } = groupPlayers(team);
    if (active.length) return active[0].id;
    return team.players.length ? team.players[0].id : null;
  }

  // ── routing: #<map>/<tab>[/<player>] ──
  function parseHash(hash, { mapIds, playerIds }) {
    const parts = String(hash || "").replace(/^#\/?/, "").split("/").map((x) => {
      try { return decodeURIComponent(x); } catch { return ""; }
    });
    const map = mapIds.includes(parts[0]) ? parts[0] : mapIds[0];
    // old links: #<map>/execute/<A|B>
    if (parts[1] === "execute") parts[1] = (parts[2] || "").toUpperCase() === "B" ? "execute-b" : "execute-a";
    const tab = TABS.includes(parts[1]) ? parts[1] : TABS[0];
    const player = tab === "lineupy" && playerIds.includes(parts[2]) ? parts[2] : null;
    return { map, tab, player };
  }

  function buildHash({ map, tab, player }) {
    let hash = `#${encodeURIComponent(map)}/${tab}`;
    if (tab === "lineupy" && player) hash += `/${encodeURIComponent(player)}`;
    return hash;
  }

  // ── personal notes ──
  const noteKey = (playerId, mapId, context) => `${NOTE_PREFIX}${playerId}:${mapId}:${context}`;

  // execute contexts keep their pre-split names so saved notes stay attached
  function noteContext(tab) {
    if (tab === "pistolowka") return "pistol";
    if (tab === "execute-a") return "execute-A";
    if (tab === "execute-b") return "execute-B";
    if (tab === "notatki") return "map";
    return tab;
  }

  function buildNotesExport(entries, date) {
    const notes = {};
    for (const [k, v] of entries) if (k.startsWith(NOTE_PREFIX) && typeof v === "string") notes[k] = v;
    return { app: "cs2-playbook", version: 1, exportedAt: date.toISOString(), notes };
  }

  function parseNotesImport(text) {
    let data;
    try { data = JSON.parse(String(text).replace(/^﻿/, "")); }
    catch { return { ok: false, error: "Plik nie jest poprawnym JSON-em." }; }
    if (!isObj(data) || data.app !== "cs2-playbook" || data.version !== 1 || !isObj(data.notes)) {
      return { ok: false, error: "To nie jest plik eksportu notatek CS2 Playbook (wersja 1)." };
    }
    const notes = {};
    for (const [k, v] of Object.entries(data.notes)) {
      if (!k.startsWith(NOTE_PREFIX)) return { ok: false, error: `Nieprawidłowy klucz notatki: ${k}` };
      if (typeof v !== "string") return { ok: false, error: `Notatka ${k} nie jest tekstem.` };
      notes[k] = v;
    }
    return { ok: true, notes };
  }

  function exportFilename(date) {
    const pad = (n) => String(n).padStart(2, "0");
    return `cs2-notatki-${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}.json`;
  }

  // ── lineups ──
  function formatAspect(aspect) {
    if (!isText(aspect)) return "?";
    return aspect === "4:3 stretched" ? "4:3 rozciągnięte" : aspect;
  }

  // true only when both are known and differ — an unknown aspect never warns
  const aspectMismatch = (lineupAspect, myAspect) => isText(lineupAspect) && isText(myAspect) && lineupAspect !== myAspect;

  // facet values in a fixed, meaningful order (not alphabetical)
  function lineupFacets(lineups) {
    const present = (order, key) => order.filter((v) => lineups.some((l) => l[key] === v));
    return { types: present(TYPES, "type"), sites: present(SITES, "site"), sides: present(SIDES, "side") };
  }

  function filterLineups(lineups, { type, site, side } = {}) {
    return lineups.filter((l) => (type == null || l.type === type) && (site == null || l.site === site) && (side == null || l.side === side));
  }

  // instant smokes: lineups thrown from a numbered spawn, in spawn order
  function instaLineups(lineups, side) {
    return lineups
      .filter((l) => l.side === side && Number.isInteger(l.spawn))
      .sort((a, b) => a.spawn - b.spawn || String(a.name).localeCompare(String(b.name)));
  }

  // Split free text into plain parts and grenade words (smoke…, flash…, molo…/molotov, incendiary).
  function utilityTokens(text) {
    const re = /\b(smoke|flash|molo|incendiary)[\p{L}'’]*/giu;
    const typeOf = (word) => {
      const w = word.toLowerCase();
      return w.startsWith("smoke") ? "smoke" : w.startsWith("flash") ? "flash" : "molotov";
    };
    const out = [];
    const str = String(text ?? "");
    let last = 0;
    for (const m of str.matchAll(re)) {
      if (m.index > last) out.push({ text: str.slice(last, m.index), type: null });
      out.push({ text: m[0], type: typeOf(m[0]) });
      last = m.index + m[0].length;
    }
    if (last < str.length) out.push({ text: str.slice(last), type: null });
    return out;
  }

  const mapAccent = (map) => (isObj(map) && typeof map.accent === "string" && HEX_RE.test(map.accent) ? map.accent : null);

  return {
    NOTE_PREFIX, ME_KEY, TABS, SPAWN_SIDES, RADAR_SIZE,
    parseJson, plural, normalizeTeam, normalizeMap,
    checkMapsIndex, checkTeam, checkMap,
    resolveRole, groupPlayers, validMe, defaultLineupPlayer,
    parseHash, buildHash,
    noteKey, noteContext, buildNotesExport, parseNotesImport, exportFilename,
    formatAspect, aspectMismatch, lineupFacets, filterLineups, instaLineups, utilityTokens, mapAccent,
  };
})();
</script>
<script>
"use strict";
const $ = (sel) => document.querySelector(sel);

function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  }
  return el;
}

// localStorage that never throws (private mode, blocked storage, quota)
const store = {
  get(key) { try { return localStorage.getItem(key); } catch { return null; } },
  set(key, value) { try { localStorage.setItem(key, value); return true; } catch { return false; } },
  remove(key) { try { localStorage.removeItem(key); return true; } catch { return false; } },
  entries(prefix) {
    const out = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(prefix)) out.push([k, localStorage.getItem(k)]);
      }
    } catch { /* storage unavailable: nothing to list */ }
    return out;
  },
};

const app = { maps: [], team: { roles: [], players: [] }, rawTeam: null, mapCache: new Map(), state: null, problems: new Map() };

const TAB_LABELS = {
  pistolowka: "Pistolówka", "execute-a": "Execute A", "execute-b": "Execute B", backup: "Backup",
  insta: "Insta smoke", lineupy: "Lineupy", notatki: "Notatki",
};

async function loadJson(path) {
  let res;
  try {
    res = await fetch(path, { cache: "no-cache" });
  } catch (err) {
    console.error(`[playbook] fetch ${path}`, err);
    throw new Error(`${path}: nie udało się pobrać pliku (błąd sieci)`);
  }
  if (!res.ok) throw new Error(`${path}: nie udało się pobrać pliku (HTTP ${res.status})`);
  return Core.parseJson(await res.text(), path);
}

function addProblems(list) {
  for (const p of list) {
    const key = `${p.file}: ${p.message}`;
    if (app.problems.has(key)) continue;
    app.problems.set(key, p);
    console.warn(`[playbook] ${key}`);
  }
  const box = $("#problems");
  const n = app.problems.size;
  box.hidden = n === 0;
  box.querySelector("summary").textContent = `⚠ ${n} ${Core.plural(n, "problem", "problemy", "problemów")} w danych`;
  box.querySelector("ul").replaceChildren(...[...app.problems.keys()].map((k) => h("li", null, k)));
}

function showFatal(title, message) {
  $("#top").hidden = true;
  $("#tabs").hidden = true;
  $("#main").replaceChildren(h("div", { class: "fatal" }, h("h1", null, title), h("p", { class: "pre" }, message)));
}

function currentMe() {
  const id = store.get(Core.ME_KEY);
  const valid = Core.validMe(id, app.team);
  if (id && !valid) store.remove(Core.ME_KEY);
  return valid;
}

function renderMePicker() {
  const sel = $("#me");
  const { active, subs } = Core.groupPlayers(app.team);
  const opt = (p) => h("option", { value: p.id }, `${p.name || p.id}${p.aspect ? ` (${Core.formatAspect(p.aspect)})` : ""}`);
  sel.replaceChildren(
    h("option", { value: "" }, "— wybierz —"),
    ...active.map(opt),
    ...(subs.length ? [h("optgroup", { label: "Rezerwowi" }, subs.map(opt))] : []),
  );
  sel.value = currentMe() || "";
  sel.addEventListener("change", () => {
    if (sel.value) store.set(Core.ME_KEY, sel.value);
    else store.remove(Core.ME_KEY);
    route();
  });
}

function renderMapButtons() {
  $("#maps").replaceChildren(...app.maps.map((m) => h("button", {
    type: "button",
    "aria-pressed": String(m.id === app.state.map),
    onclick: () => navigate({ map: m.id, player: null }),
  }, m.name || m.id)));
}

function renderTabs() {
  const tab = (t) => h("button", {
    type: "button", role: "tab",
    "aria-selected": String(app.state.tab === t),
    onclick: () => navigate({ tab: t }),
  }, TAB_LABELS[t]);
  $("#tabs").replaceChildren(tab("pistolowka"), tab("execute-a"), tab("execute-b"), tab("backup"), h("span", { class: "sep" }),
    tab("insta"), tab("lineupy"), tab("notatki"));
}

function navigate(partial) {
  location.hash = Core.buildHash({ ...app.state, ...partial });
}

function getMap(id) {
  if (!app.mapCache.has(id)) {
    const promise = loadJson(`data/${id}.json`).then((data) => {
      addProblems(Core.checkMap(data, id, app.rawTeam));
      return Core.normalizeMap(data);
    });
    promise.catch(() => app.mapCache.delete(id)); // retry on next navigation
    app.mapCache.set(id, promise);
  }
  return app.mapCache.get(id);
}

async function route() {
  flushNoteSaves();
  const s = Core.parseHash(location.hash, {
    mapIds: app.maps.map((m) => m.id),
    playerIds: app.team.players.map((p) => p.id),
  });
  const canonical = Core.buildHash(s);
  if (location.hash !== canonical) history.replaceState(null, "", canonical);
  app.state = s;
  renderMapButtons();
  renderTabs();
  const mapEntry = app.maps.find((m) => m.id === s.map) || {};
  const mapName = mapEntry.name || s.map;
  document.title = `${mapName} · ${TAB_LABELS[s.tab]} — CS2 Playbook`;
  const accent = Core.mapAccent(mapEntry);
  if (accent) document.documentElement.style.setProperty("--accent", accent);
  else document.documentElement.style.removeProperty("--accent");
  const main = $("#main");
  let map;
  try {
    map = await getMap(s.map);
  } catch (err) {
    console.error("[playbook]", err);
    if (app.state === s) {
      main.replaceChildren(h("div", { class: "fatal" }, h("h1", null, "Nie udało się wczytać mapy"), h("p", { class: "pre" }, err.message)));
    }
    return;
  }
  if (app.state !== s) return; // a newer navigation started while loading
  main.replaceChildren();
  const view = VIEWS[s.tab];
  if (view) view(main, { map, state: s });
}

async function boot() {
  if (location.protocol === "file:") {
    showFatal("Uruchom przez lokalny serwer",
      "Przeglądarka blokuje wczytywanie plików JSON z file://.\n\nW folderze repozytorium uruchom:\n\n    python3 -m http.server 8000\n\ni otwórz http://localhost:8000");
    return;
  }
  try {
    const [mapsIdx, team] = await Promise.all([loadJson("data/maps.json"), loadJson("data/team.json")]);
    app.maps = (Array.isArray(mapsIdx && mapsIdx.maps) ? mapsIdx.maps : [])
      .filter((m) => m && typeof m.id === "string" && /^[a-z0-9-]+$/.test(m.id));
    app.rawTeam = team; // checkMap needs the raw shape to know when reference checks must be skipped
    app.team = Core.normalizeTeam(team);
    addProblems([...Core.checkMapsIndex(mapsIdx), ...Core.checkTeam(team)]);
  } catch (err) {
    console.error("[playbook]", err);
    showFatal("Nie udało się wczytać danych", err.message);
    return;
  }
  if (!app.maps.length) {
    showFatal("Brak map", "Plik data/maps.json nie zawiera żadnej poprawnej mapy.");
    return;
  }
  $("#top").hidden = false;
  $("#tabs").hidden = false;
  renderMePicker();
  window.addEventListener("hashchange", route);
  await route();
}

// ── views: each later section registers VIEWS[<tab>] ──
const VIEWS = {};

// ── personal notes ──
const pendingNoteSaves = new Set();
function flushNoteSaves() {
  for (const save of [...pendingNoteSaves]) save();
}
window.addEventListener("pagehide", flushNoteSaves);

function notesWidget(mapId, context, label = "Moje notatki") {
  const me = currentMe();
  const wrap = h("div", { class: "notes" }, h("h2", null, label));
  const ta = h("textarea", {
    "aria-label": label,
    disabled: !me,
    placeholder: me ? "Twoje prywatne notatki — zapisują się automatycznie w tej przeglądarce." : "Wybierz gracza w „Kim jestem”, aby pisać notatki.",
  });
  wrap.append(ta);
  if (!me) return wrap;

  const key = Core.noteKey(me, mapId, context);
  ta.value = store.get(key) || "";
  const status = h("span", { class: "muted" });
  let timer = null;
  const save = () => {
    clearTimeout(timer);
    timer = null;
    pendingNoteSaves.delete(save);
    const ok = ta.value.trim() ? store.set(key, ta.value) : store.remove(key);
    status.className = ok ? "muted" : "err";
    status.textContent = ok ? "✓ zapisano" : "✗ nie zapisano — pamięć przeglądarki niedostępna";
  };
  ta.addEventListener("input", () => {
    status.textContent = "";
    clearTimeout(timer);
    timer = setTimeout(save, 400);
    pendingNoteSaves.add(save);
  });
  ta.addEventListener("blur", () => { if (timer) save(); });

  const clearBtn = h("button", { type: "button", class: "linkbtn" }, "Wyczyść");
  const confirmBox = h("span", { hidden: true }, "Na pewno? ",
    h("button", { type: "button", class: "linkbtn", onclick: () => { ta.value = ""; save(); confirmBox.hidden = true; clearBtn.hidden = false; } }, "Tak"),
    " ",
    h("button", { type: "button", class: "linkbtn", onclick: () => { confirmBox.hidden = true; clearBtn.hidden = false; } }, "Nie"));
  clearBtn.addEventListener("click", () => { clearBtn.hidden = true; confirmBox.hidden = false; });
  wrap.append(h("div", { class: "bar" }, status, h("span", { class: "spacer" }), clearBtn, confirmBox));
  return wrap;
}

VIEWS.notatki = (main, { state }) => {
  const mapName = (app.maps.find((m) => m.id === state.map) || {}).name || state.map;
  main.append(
    h("div", { class: "titlebar" }, h("h1", null, `Notatki — ${mapName}`)),
    h("p", { class: "muted" }, "Prywatne notatki do całej mapy. Zapisują się tylko w tej przeglądarce na tym urządzeniu — użyj eksportu, aby je przenieść."),
    notesWidget(state.map, "map", "Moje notatki do mapy"),
  );
};

function ioStatus(message, isError) {
  const el = $("#io-status");
  el.className = isError ? "err" : "muted";
  el.textContent = message;
}

function exportNotes() {
  flushNoteSaves();
  const now = new Date();
  const data = Core.buildNotesExport(store.entries(Core.NOTE_PREFIX), now);
  const n = Object.keys(data.notes).length;
  if (!n) return ioStatus("Brak notatek do eksportu.");
  const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
  const a = h("a", { href: url, download: Core.exportFilename(now) });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  ioStatus(`Wyeksportowano ${n} ${Core.plural(n, "notatkę", "notatki", "notatek")}.`);
}

async function importNotes(file) {
  let text;
  try { text = await file.text(); } catch { return ioStatus("Nie udało się odczytać pliku.", true); }
  const result = Core.parseNotesImport(text);
  if (!result.ok) return ioStatus(result.error, true);
  let saved = 0, failed = 0;
  for (const [k, v] of Object.entries(result.notes)) {
    if (!v.trim()) continue;
    if (store.set(k, v)) saved++; else failed++;
  }
  if (failed) ioStatus(`Zaimportowano ${saved}, nie zapisano ${failed} — pamięć przeglądarki niedostępna.`, true);
  else ioStatus(`Zaimportowano ${saved} ${Core.plural(saved, "notatkę", "notatki", "notatek")}.`);
  route();
}

$("#export-notes").addEventListener("click", exportNotes);
$("#import-notes").addEventListener("click", () => $("#import-file").click());
$("#import-file").addEventListener("change", (e) => {
  const file = e.target.files[0];
  e.target.value = ""; // allow importing the same file again
  if (file) importNotes(file);
});

// ── images + lightbox ──
function shot(path, caption, sourceFile) {
  if (!path) return null;
  const img = h("img", { class: "shot", src: path, alt: caption || path, loading: "lazy" });
  img.addEventListener("error", () => {
    addProblems([{ file: sourceFile, message: `brak pliku obrazka "${path}"` }]);
    img.replaceWith(h("div", { class: "missing" }, `Brak pliku: ${path}`));
  }, { once: true });
  img.addEventListener("click", () => openLightbox(path, caption));
  return img;
}

function openLightbox(path, caption) {
  const lb = $("#lightbox");
  lb.querySelector("img").src = path;
  lb.querySelector(".cap").textContent = caption ? `${caption} · ${path}` : path;
  lb.hidden = false;
  lb.querySelector("button").focus();
}

function closeLightbox() {
  const lb = $("#lightbox");
  lb.hidden = true;
  lb.querySelector("img").removeAttribute("src");
}

$("#lightbox").addEventListener("click", closeLightbox);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !$("#lightbox").hidden) closeLightbox();
});

// ── strategy tabs ──
const TYPE_LABELS = { smoke: "Smoke", flash: "Flash", molotov: "Molotov" };

function aspectTag(player) {
  return h("span", {
    class: "asp",
    title: player.aspect ? "Proporcje ekranu gracza" : "Proporcje nieustawione — uzupełnij \"aspect\" w data/team.json",
  }, Core.formatAspect(player.aspect));
}

function utilityCell(text) {
  return Core.utilityTokens(text).map((t) => (t.type ? h("span", { class: `ut ut-${t.type}` }, t.text) : t.text));
}

const PLAYER_PALETTE = ["#4aa8e0", "#6cc06a", "#b07ee8", "#e07bb5", "#4fd1c5", "#f0a050", "#c9d36a"];

// "color" from data/team.json, else a stable colour from the player's position in the list
function playerColor(player) {
  if (player.color) return player.color;
  return PLAYER_PALETTE[Math.max(0, app.team.players.indexOf(player)) % PLAYER_PALETTE.length];
}

// nick in the player's colour, with a dot, so each player is easy to spot
function playerTag(p) {
  const color = playerColor(p);
  return h("span", { class: "pname", style: `color:${color}` }, h("span", { class: "swatch", style: `background:${color}` }), p.name || p.id);
}

function playerCell(roleId) {
  const res = Core.resolveRole(app.team, roleId);
  if (res.kind === "none") return h("span", { class: "warn" }, "— brak gracza");
  const names = res.players.map((p, i) => [i ? ", " : "", playerTag(p), aspectTag(p)]);
  return res.kind === "sub" ? [names, " ", h("span", { class: "muted" }, "(rezerwa)")] : names;
}

// strategy text: grenade words and player nicks in their colours
function richText(text) {
  const byName = new Map(app.team.players.map((p) => [String(p.name || p.id).toLowerCase(), p]));
  const escape = (x) => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = byName.size ? new RegExp(`(?<![\\p{L}\\d])(${[...byName.keys()].map(escape).join("|")})(?![\\p{L}\\d])`, "giu") : null;
  const nicks = (str) => {
    if (!re) return str;
    const out = [];
    let last = 0;
    for (const m of str.matchAll(re)) {
      out.push(str.slice(last, m.index));
      const p = byName.get(m[1].toLowerCase());
      out.push(h("b", { class: "pname", style: `color:${playerColor(p)}` }, m[1]));
      last = m.index + m[1].length;
    }
    out.push(str.slice(last));
    return out;
  };
  return Core.utilityTokens(text).map((t) => (t.type ? h("span", { class: `ut ut-${t.type}` }, t.text) : nicks(t.text)));
}

function assignmentsTable(rows) {
  const roleName = (id) => (app.team.roles.find((r) => r.id === id) || {}).name;
  return h("table", null,
    h("thead", null, h("tr", null, ["Rola", "Gracz", "Pozycja", "Utility", "Zadanie", "Timing", "Uwagi"].map((t) => h("th", null, t)))),
    h("tbody", null, rows.map((r) => h("tr", null,
      h("td", null, roleName(r.role) || h("span", { class: "warn" }, `⚠ nieznana rola: ${r.role ?? "(brak)"}`)),
      h("td", null, playerCell(r.role)),
      ["position", "utility", "action", "timing", "notes"].map((k) => h("td", { class: "pre" }, k === "utility" ? utilityCell(r[k]) : r[k] ?? "")),
    ))));
}

function renderStrategyTab(main, { map, state }) {
  const file = `data/${state.map}.json`;
  const strat = {
    pistolowka: map.strategies.pistol,
    "execute-a": map.strategies.execute.A,
    "execute-b": map.strategies.execute.B,
    backup: map.strategies.backup,
  }[state.tab];
  const context = Core.noteContext(state.tab);

  if (!strat) {
    main.append(h("div", { class: "empty" }, `Brak strategii: ${TAB_LABELS[state.tab]}.`, h("br"),
      h("span", { class: "muted" }, `Dodaj ją w ${file}.`)));
    main.append(notesWidget(state.map, context));
    return;
  }

  main.append(h("div", { class: "titlebar" },
    h("h1", null, strat.title || "(bez tytułu)"),
    strat.example ? h("span", { class: "badge", title: "Przykładowe dane — podmień na własną strategię" }, "PRZYKŁAD") : null));

  const board = strat.board && map.radar ? tacticBoard(map.radar, strat, file) : null;
  const steps = strat.steps.map((s, i) => h("li", board ? {
    class: "step-btn",
    title: "Pokaż granaty z tego kroku",
    onclick: (e) => {
      const on = board.focus(board.focused === i + 1 ? null : i + 1);
      for (const li of e.currentTarget.parentElement.children) li.classList.toggle("on", on === Number(li.dataset.step));
    },
    "data-step": i + 1,
  } : null, richText(s)));
  const text = h("div", null,
    strat.summary ? [h("h2", null, "Opis"), h("p", { class: "pre" }, richText(strat.summary))] : null,
    steps.length ? [h("h2", null, "Kroki"), board ? h("p", { class: "muted hint" }, "Kliknij krok, żeby podświetlić jego granaty na mapie.") : null,
      h("ol", { class: "steps" }, steps)] : null);
  const visual = board ? board.el : strat.image ? shot(strat.image, strat.title, file) : null;
  main.append(visual ? h("div", { class: "split" }, h("div", null, visual), text) : text);

  if (strat.assignments.length) main.append(h("h2", null, "Zadania graczy"), assignmentsTable(strat.assignments));
  if (strat.notes) main.append(h("h2", null, "Notatki zespołu"), h("p", { class: "pre" }, strat.notes));
  main.append(notesWidget(state.map, context));
}

// ── tactic board: radar drawn like a strat board, routes and grenades in radar pixels ──
const SVG_NS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...children) {
  const el = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null && v !== false) el.setAttribute(k, v);
  for (const c of children.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}

const BOARD_LINE = "#38c8dc";

// navy floor, cyan outer wall, fainter cyan for boxes and stairs (edges of the radar's shading)
function radarFilter(id) {
  return s("filter", { id, x: 0, y: 0, width: 1, height: 1, "color-interpolation-filters": "sRGB" },
    s("feComponentTransfer", { in: "SourceAlpha", result: "area" }, s("feFuncA", { type: "discrete", tableValues: "0 0 1 1" })),
    s("feFlood", { "flood-color": "#10222e", result: "floorColor" }),
    s("feComposite", { in: "floorColor", in2: "area", operator: "in", result: "floor" }),
    s("feMorphology", { in: "area", operator: "erode", radius: 1.5, result: "inner" }),
    s("feComposite", { in: "area", in2: "inner", operator: "out", result: "edge" }),
    s("feFlood", { "flood-color": BOARD_LINE, result: "lineColor" }),
    s("feComposite", { in: "lineColor", in2: "edge", operator: "in", result: "outline" }),
    s("feColorMatrix", { in: "SourceGraphic", type: "luminanceToAlpha", result: "lum" }),
    s("feConvolveMatrix", { in: "lum", order: 3, kernelMatrix: "-1 -1 -1 -1 8 -1 -1 -1 -1", preserveAlpha: "false", result: "lap" }),
    s("feComponentTransfer", { in: "lap", result: "detailMask" }, s("feFuncA", { type: "linear", slope: 5, intercept: -0.15 })),
    s("feComposite", { in: "detailMask", in2: "inner", operator: "in", result: "detailInside" }),
    s("feFlood", { "flood-color": BOARD_LINE, "flood-opacity": 0.5, result: "detailColor" }),
    s("feComposite", { in: "detailColor", in2: "detailInside", operator: "in", result: "detail" }),
    s("feMerge", null, s("feMergeNode", { in: "floor" }), s("feMergeNode", { in: "detail" }), s("feMergeNode", { in: "outline" })));
}

function grenadeMark(type, [x, y]) {
  const cls = `ut-${type}`;
  if (type === "smoke") return s("circle", { class: cls, cx: x, cy: y, r: 26, style: "fill:currentColor;fill-opacity:.38;stroke:currentColor;stroke-width:2" });
  if (type === "molotov") return s("circle", { class: cls, cx: x, cy: y, r: 20, style: "fill:currentColor;fill-opacity:.45;stroke:currentColor;stroke-width:2.5" });
  const pts = Array.from({ length: 16 }, (_, i) => {
    const r = i % 2 ? 7 : 18, a = (i * Math.PI) / 8;
    return `${(x + r * Math.cos(a)).toFixed(1)},${(y + r * Math.sin(a)).toFixed(1)}`;
  }).join(" ");
  return s("polygon", { class: cls, points: pts, style: "fill:currentColor;stroke:#0b1016;stroke-width:1.5" });
}

// polyline moved sideways by d px (miter joins), so players walking together show as parallel lines
function offsetRoute(points, d) {
  if (!d) return points;
  const normal = (a, b) => {
    const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy) || 1;
    return [-dy / len, dx / len];
  };
  return points.map((p, i) => {
    const n1 = i > 0 ? normal(points[i - 1], p) : null;
    const n2 = i < points.length - 1 ? normal(p, points[i + 1]) : null;
    let [nx, ny] = n1 && n2 ? [n1[0] + n2[0], n1[1] + n2[1]] : n1 || n2;
    const len = Math.hypot(nx, ny) || 1;
    [nx, ny] = [nx / len, ny / len];
    const cos = n1 && n2 ? Math.max(0.5, nx * n1[0] + ny * n1[1]) : 1;
    return [p[0] + (nx * d) / cos, p[1] + (ny * d) / cos];
  });
}

function tacticBoard(radar, strat, file) {
  const filterId = "radar-style";
  const who = (role) => {
    const p = Core.resolveRole(app.team, role).players[0];
    if (!p) return { name: role, short: role.slice(0, 2), color: "#8a9099" };
    const name = p.name || p.id;
    return { name, short: p.short || name.slice(0, 2), color: playerColor(p) };
  };
  const roles = [...strat.assignments.map((a) => a.role), ...Object.keys(strat.board.players)]
    .filter((r, i, all) => typeof r === "string" && all.indexOf(r) === i);
  const halo = "paint-order:stroke;stroke:#0b1016;stroke-width:4px;stroke-linejoin:round";

  const root = s("svg", { class: "board-svg", viewBox: `0 0 ${Core.RADAR_SIZE} ${Core.RADAR_SIZE}`, role: "img", "aria-label": `Tablica: ${strat.title || ""}` },
    s("defs", null, radarFilter(filterId), roles.map((r) => s("marker", {
      id: `arrow-${r}`, viewBox: "0 0 10 10", refX: 6, refY: 5, markerWidth: 4, markerHeight: 4, orient: "auto-start-reverse",
    }, s("path", { d: "M0,0 L10,5 L0,10 z", fill: who(r).color })))),
    s("rect", { width: Core.RADAR_SIZE, height: Core.RADAR_SIZE, fill: "#0b1016" }),
    s("image", { href: radar.image, width: Core.RADAR_SIZE, height: Core.RADAR_SIZE, filter: `url(#${filterId})` }));

  for (const l of radar.labels) {
    const [x, y] = l.at;
    if (l.kind === "site") {
      root.append(s("rect", { x: x - 30, y: y - 30, width: 60, height: 60, rx: 6, fill: BOARD_LINE, "fill-opacity": 0.22 }),
        s("text", { x, y: y + 15, "text-anchor": "middle", "font-size": 42, "font-weight": 700, fill: "#e8f6f8" }, l.text));
    } else {
      const big = l.kind === "spawn";
      root.append(s("text", { x, y, "text-anchor": "middle", "font-size": big ? 22 : 15, "font-weight": big ? 700 : 600,
        fill: big ? "#e8f6f8" : "#8fb3bd", style: halo }, l.text));
    }
  }

  const routes = s("g", { class: "routes" });
  const walking = roles.filter((r) => strat.board.players[r]);
  walking.forEach((r, i) => {
    const route = offsetRoute(strat.board.players[r], (i - (walking.length - 1) / 2) * 7);
    routes.append(s("polyline", { points: route.map((p) => p.map((n) => n.toFixed(1)).join(",")).join(" "), fill: "none",
      stroke: who(r).color, "stroke-width": 5, "stroke-linejoin": "round", "stroke-linecap": "round", "marker-end": `url(#arrow-${r})` }));
  });
  // tokens at route ends; players ending in the same spot are spread sideways
  const ends = new Map();
  for (const r of roles) {
    const route = strat.board.players[r];
    if (!route) continue;
    const [x, y] = route[route.length - 1];
    const key = `${Math.round(x / 40)}:${Math.round(y / 40)}`;
    if (!ends.has(key)) ends.set(key, []);
    ends.get(key).push({ r, x, y });
  }
  for (const group of ends.values()) {
    group.forEach(({ r, x, y }, k) => {
      const tx = x + (k - (group.length - 1) / 2) * 34, ty = y - 30;
      const { short, color } = who(r);
      routes.append(s("circle", { cx: tx, cy: ty, r: 16, fill: color, stroke: "#0b1016", "stroke-width": 2 }),
        s("text", { x: tx, y: ty + 5.5, "text-anchor": "middle", "font-size": 16, "font-weight": 800, fill: "#0b1016" }, short));
    });
  }

  const grenades = s("g", { class: "grenades" });
  const marks = [];
  for (const g of strat.board.grenades) {
    const { name, color } = who(g.role);
    const item = s("g", { class: "grenade", "data-step": g.step ?? "" },
      s("line", { class: `ut-${g.type}`, x1: g.from[0], y1: g.from[1], x2: g.to[0], y2: g.to[1],
        style: "stroke:currentColor;stroke-width:2.5;stroke-dasharray:8 6;opacity:.9" }),
      s("circle", { cx: g.from[0], cy: g.from[1], r: 5, fill: color, stroke: "#0b1016", "stroke-width": 1.5 }),
      grenadeMark(g.type, g.to),
      s("text", { x: g.to[0], y: g.to[1] + (g.type === "smoke" ? 44 : 38), "text-anchor": "middle", "font-size": 15, "font-weight": 700,
        fill: color, style: halo }, name));
    grenades.append(item);
    marks.push(item);
  }
  root.append(routes, grenades);

  const coords = h("p", { class: "muted coords" }, "Kliknij mapę, żeby odczytać punkt [x, y] do ", h("code", null, file), ".");
  root.addEventListener("click", (e) => {
    const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(root.getScreenCTM().inverse());
    coords.textContent = `Punkt: [${Math.round(pt.x)}, ${Math.round(pt.y)}]`;
  });

  const board = {
    el: h("div", { class: "board" }, root, coords),
    focused: null,
    focus(step) {
      board.focused = step;
      root.classList.toggle("focused", step != null);
      for (const m of marks) m.classList.toggle("on", step != null && Number(m.dataset.step) === step);
      return step;
    },
  };
  return board;
}

VIEWS.insta = (main, { map, state }) => {
  const file = `data/${state.map}.json`;
  const mapName = (app.maps.find((m) => m.id === state.map) || {}).name || state.map;
  main.append(h("div", { class: "titlebar" }, h("h1", null, `Insta smoke — ${mapName}`)),

  let shown = 0;
  for (const side of Core.SPAWN_SIDES) {

    shown++;
    main.append(h("h2", null, `Strona ${side}`), h("div", { class: "split" },

        h("span", { class: "muted" }, `Dodaj "spawns": { "${side}": "…" } w ${file}.`)),

        ? h("div", { class: "insta-grid" }, list.map((l) => h("div", { class: "insta-card" },
          shot(l.image, `#${l.spawn} — ${l.name}`, file),

};

// ── lineups tab ──
function lineupRow(l, mapId, file, myAspect) {
  const aspect = Core.formatAspect(l.aspect);
  const known = Object.hasOwn(TYPE_LABELS, l.type);
  const kv = (k, v) => (v ? [h("dt", null, k), h("dd", null, v)] : null);
  return h("div", { class: known ? `lineup type-${l.type}` : "lineup" },
    h("div", null, shot(l.image, `${l.name || l.id} · ${aspect}`, file)),
    h("div", null,
      h("div", { class: "titlebar" },
        known ? h("span", { class: `type ut-${l.type}` }, TYPE_LABELS[l.type]) : null,
        h("h1", null, l.name || l.id),
        h("span", { class: "res", title: "Proporcje ekranu, dla których działa ten lineup" }, aspect),
        l.example ? h("span", { class: "badge" }, "PRZYKŁAD") : null),
      Core.aspectMismatch(l.aspect, myAspect)
        ? h("p", { class: "warn" }, `⚠ Lineup pod ${aspect} — Ty grasz na ${Core.formatAspect(myAspect)}, może nie wejść.`)
        : null,
      h("dl", { class: "kv" }, kv("Rejon", l.site), kv("Strona", l.side),
        kv("Spawn", l.spawn != null ? `#${l.spawn}` : null), kv("Skąd", l.from), kv("Rzut", l.throw)),
      l.instructions ? [h("h2", null, "Instrukcja"), h("p", { class: "pre" }, l.instructions)] : null,
      l.notes ? [h("h2", null, "Notatki zespołu"), h("p", { class: "pre" }, l.notes)] : null,
      notesWidget(mapId, `lineup:${l.id}`)));
}

VIEWS.lineupy = (main, { map, state }) => {
  const file = `data/${state.map}.json`;
  const mapName = (app.maps.find((m) => m.id === state.map) || {}).name || state.map;
  const playerId = state.player || Core.defaultLineupPlayer(app.team, currentMe());
  const { active, subs } = Core.groupPlayers(app.team);
  const count = (id) => map.lineups.filter((l) => l.player === id).length;
  const playerBtn = (p) => h("button", {
    type: "button",
    "aria-pressed": String(p.id === playerId),
    onclick: () => navigate({ player: p.id }),
  }, h("span", null, playerTag(p), aspectTag(p)), h("span", { class: "muted" }, String(count(p.id))));

  const content = h("div");
  main.append(h("div", { class: "layout-lineups" },
    h("div", { class: "plist" },
      h("h2", null, "Skład"), active.map(playerBtn),
      subs.length ? [h("h2", null, "Rezerwowi"), subs.map(playerBtn)] : null),
    content));

  const player = app.team.players.find((p) => p.id === playerId);
  if (!player) {
    content.append(h("div", { class: "empty" }, "Brak graczy w data/team.json."));
    return;
  }
  const mine = map.lineups.filter((l) => l.player === playerId);
  if (!mine.length) {
    content.append(h("div", { class: "empty" }, `Brak lineupów dla ${player.name || player.id} na ${mapName}.`, h("br"),
      h("span", { class: "muted" }, `Dodaj je w ${file} i assets/lineups/${state.map}/${player.id}/.`)));
    return;
  }

  const me = app.team.players.find((p) => p.id === currentMe());
  const myAspect = me ? me.aspect : null;
  const filter = { type: null, site: null, side: null };
  const list = h("div");
  const draw = () => {
    const shown = Core.filterLineups(mine, filter);
    list.replaceChildren(...(shown.length
      ? shown.map((l) => lineupRow(l, state.map, file, myAspect))
      : [h("div", { class: "empty" }, "Brak lineupów dla wybranych filtrów.")]));
  };
  const chips = (label, key, values, fmt) => {
    if (values.length < 2) return null;
    const seg = h("div", { class: "seg", role: "group", "aria-label": label });
    for (const v of [null, ...values]) {
      seg.append(h("button", {
        type: "button",
        "aria-pressed": String(filter[key] === v),
        onclick: (e) => {
          filter[key] = v;
          for (const b of seg.children) b.setAttribute("aria-pressed", String(b === e.currentTarget));
          draw();
        },
      }, v === null ? "Wszystkie" : fmt(v)));
    }
    return h("span", null, h("span", { class: "muted" }, label), seg);
  };
  const facets = Core.lineupFacets(mine);
  content.append(
    h("div", { class: "filters" },
      chips("Typ:", "type", facets.types, (v) => h("span", { class: `ut-${v}` }, TYPE_LABELS[v])),
      chips("Rejon:", "site", facets.sites, (v) => v),
      chips("Strona:", "side", facets.sides, (v) => v)),
    list);
  draw();
};

boot();
</script>
</body>
</html>
